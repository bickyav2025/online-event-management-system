<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Application Error')}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5 my-auto text-center">
    <div class="custom-card p-5 mx-auto" style="max-width: 600px;">
        <div class="stat-icon amber mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem;">
            <i class="bi bi-exclamation-diamond-fill"></i>
        </div>
        <h1 class="display-4 fw-extrabold text-dark mb-2" th:text="${errorCode != null ? errorCode : '500'}">500</h1>
        <h4 class="fw-bold mb-3" th:text="${errorTitle != null ? errorTitle : 'Unexpected Error Occurred'}">Error</h4>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested resource could not be found or an unexpected error occurred.'}"></p>

        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-primary-custom">Return to Home</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Go Back</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
