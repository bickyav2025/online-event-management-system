<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Account')}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="custom-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-logo-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold">Create an Account</h3>
                    <p class="text-muted small">Join EventFlow to discover, book, or host world-class events.</p>
                </div>

                <form th:action="@{/register}" th:object="${userDto}" method="post">
                    <!-- Role Picker -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold">I want to:</label>
                        <div class="row g-2">
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="roleAttendee" value="ATTENDEE" th:field="*{role}" checked>
                                <label class="btn btn-outline-custom w-100 py-2 text-center" for="roleAttendee">
                                    <i class="bi bi-ticket-perforated me-1"></i> Attend Events
                                </label>
                            </div>
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="roleOrganizer" value="ORGANIZER" th:field="*{role}">
                                <label class="btn btn-outline-custom w-100 py-2 text-center" for="roleOrganizer">
                                    <i class="bi bi-kanban me-1"></i> Host & Organize
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Full Name</label>
                        <input type="text" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" placeholder="Alex Morgan" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="alex@example.com" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="At least 6 chars" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Confirm Password</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Repeat password" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Phone (Optional)</label>
                            <input type="tel" th:field="*{phone}" class="form-control" placeholder="+1 234 567 8900">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">City (Optional)</label>
                            <input type="text" th:field="*{city}" class="form-control" placeholder="San Francisco">
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary-custom justify-content-center py-2 fs-6">
                            Create Account
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 text-muted small">
                    Already have an account? <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
