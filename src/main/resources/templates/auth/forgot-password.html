<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset Password')}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container py-5 my-auto">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="custom-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-logo-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="bi bi-key-fill"></i>
                    </div>
                    <h3 class="fw-bold">Password Recovery</h3>
                    <p class="text-muted small">Enter your email and set a new password for your account.</p>
                </div>

                <form th:action="@{/forgot-password}" th:object="${resetDto}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Account Email</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">New Password</label>
                        <input type="password" th:field="*{newPassword}" class="form-control" placeholder="At least 6 characters" required>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary-custom justify-content-center py-2 fs-6">
                            Update Password
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 text-muted small">
                    Remember your credentials? <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none">Return to Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
