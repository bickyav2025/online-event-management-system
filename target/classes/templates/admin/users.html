<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('User Management')}">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="dashboard-wrapper">
    <div th:replace="~{fragments/sidebar :: admin-sidebar('users')}"></div>

    <main class="dashboard-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">User Management</h2>
                <p class="text-muted mb-0">View registered accounts, assign administrative privileges, and govern access.</p>
            </div>
            <span class="badge bg-primary px-3 py-2 fs-6 rounded-pill" th:text="${totalUsers + ' Accounts'}">0 Accounts</span>
        </div>

        <!-- Search & Filter Card -->
        <div class="custom-card p-4 mb-4">
            <form th:action="@{/admin/users}" method="get" class="row g-3">
                <div class="col-md-5">
                    <label class="form-label small fw-bold text-muted">Search Name or Email</label>
                    <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search accounts...">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Filter by Role</label>
                    <select name="role" class="form-select">
                        <option value="">All Roles</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${selectedRole == r}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted">Status</label>
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${selectedStatus == s}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-grid align-self-end">
                    <button type="submit" class="btn btn-primary-custom justify-content-center">
                        <i class="bi bi-funnel me-1"></i> Filter
                    </button>
                </div>
            </form>
        </div>

        <!-- Users Table Card -->
        <div class="custom-card p-4">
            <div class="table-responsive">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Role</th>
                            <th>Location / Phone</th>
                            <th>Status</th>
                            <th>Registered</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td>
                                <strong class="d-block" th:text="${user.fullName}">Name</strong>
                                <small class="text-muted" th:text="${user.email}">user@email.com</small>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${user.role.name() == 'ADMIN' ? 'bg-danger' : (user.role.name() == 'ORGANIZER' ? 'bg-primary' : 'bg-secondary')}"
                                      th:text="${user.role}">ROLE</span>
                            </td>
                            <td>
                                <small class="d-block text-muted" th:text="${user.city != null ? user.city : 'Not specified'}">City</small>
                                <small class="text-muted" th:text="${user.phone}">Phone</small>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${user.active ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}"
                                      th:text="${user.status}">ACTIVE</span>
                            </td>
                            <td class="text-muted small" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">Date</td>
                            <td class="text-end">
                                <div class="d-flex justify-content-end gap-2">
                                    <!-- Edit Button (Opens Modal) -->
                                    <button type="button" class="btn btn-sm btn-outline-secondary"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#editUserModal-' + ${user.id}">
                                        <i class="bi bi-pencil"></i>
                                    </button>

                                    <!-- Toggle Status Button -->
                                    <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post">
                                        <button type="submit" class="btn btn-sm"
                                                th:classappend="${user.active ? 'btn-outline-warning' : 'btn-outline-success'}"
                                                th:title="${user.active ? 'Deactivate account' : 'Activate account'}">
                                            <i class="bi" th:classappend="${user.active ? 'bi-lock' : 'bi-unlock'}"></i>
                                        </button>
                                    </form>

                                    <!-- Delete Button -->
                                    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this user permanently?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>

                                <!-- Edit User Modal -->
                                <div class="modal fade text-start" th:id="'editUserModal-' + ${user.id}" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content rounded-4 border-0 shadow">
                                            <div class="modal-header border-bottom">
                                                <h5 class="modal-title fw-bold">Edit User Details</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <form th:action="@{/admin/users/update}" method="post">
                                                <div class="modal-body">
                                                    <input type="hidden" name="id" th:value="${user.id}">

                                                    <div class="mb-3">
                                                        <label class="form-label small fw-bold">Full Name</label>
                                                        <input type="text" name="fullName" th:value="${user.fullName}" class="form-control" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label small fw-bold">Email Address</label>
                                                        <input type="email" name="email" th:value="${user.email}" class="form-control" required>
                                                    </div>
                                                    <div class="row g-2 mb-3">
                                                        <div class="col-6">
                                                            <label class="form-label small fw-bold">Role</label>
                                                            <select name="role" class="form-select">
                                                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${user.role == r}"></option>
                                                            </select>
                                                        </div>
                                                        <div class="col-6">
                                                            <label class="form-label small fw-bold">Status</label>
                                                            <select name="status" class="form-select">
                                                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${user.status == s}"></option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label small fw-bold">Reset Password (Optional)</label>
                                                        <input type="password" name="newPassword" class="form-control" placeholder="Leave blank to keep existing password">
                                                    </div>
                                                </div>
                                                <div class="modal-footer border-top">
                                                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                                                    <button type="submit" class="btn btn-primary-custom">Save Changes</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1}, search=${search}, role=${selectedRole}, status=${selectedStatus})}">Previous</a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item" th:classappend="${currentPage == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{/admin/users(page=${i}, search=${search}, role=${selectedRole}, status=${selectedStatus})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1}, search=${search}, role=${selectedRole}, status=${selectedStatus})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
