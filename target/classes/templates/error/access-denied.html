<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5 my-auto text-center">
    <div class="custom-card p-5 mx-auto" style="max-width: 600px;">
        <div class="stat-icon amber mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem; background: #fee2e2; color: #dc2626;">
            <i class="bi bi-shield-x"></i>
        </div>
        <h1 class="display-4 fw-extrabold text-danger mb-2">403</h1>
        <h4 class="fw-bold mb-3">Access Denied</h4>
        <p class="text-muted mb-4">You do not have the required permissions or role to view this restricted page.</p>

        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-primary-custom">Return to Home</a>
            <a th:href="@{/login}" class="btn btn-outline-secondary">Switch Account</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
